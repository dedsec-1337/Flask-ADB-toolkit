name: ShellCheck

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell script syntax
        run: |
          bash -n flask-adb-toolkit.sh
          echo "Syntax OK"
      - name: ShellCheck
        run: shellcheck flask-adb-toolkit.sh
