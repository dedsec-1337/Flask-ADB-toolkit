<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask-ADB-toolkit | Premium Terminal Toolkit</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --font-sans: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }
        body {
            font-family: var(--font-sans);
            background-color: #000;
            color: #e2e8f0;
            overflow-x: hidden;
            cursor: none; 
        }
        code, pre { font-family: var(--font-mono); }

        .cursor {
            width: 8px; height: 8px; background: white; border-radius: 50%;
            position: fixed; pointer-events: none; z-index: 9999;
            mix-blend-mode: difference; transition: transform 0.1s ease;
        }
        .cursor-ring {
            width: 40px; height: 40px; border: 1px solid rgba(255,255,255,0.5);
            border-radius: 50%; position: fixed; pointer-events: none; z-index: 9998;
            transition: transform 0.15s ease-out;
        }
        #matrix-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; opacity: 0.15; pointer-events: none;
        }
        .glass-panel {
            background: rgba(10, 10, 10, 0.4); backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1rem; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-panel:hover {
            border-color: rgba(255, 255, 255, 0.3); transform: translateY(-4px);
            box-shadow: 0 20px 40px -15px rgba(255, 255, 255, 0.05);
        }
        .gradient-text {
            background: linear-gradient(135deg, #ffffff 0%, #a0a0a0 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .terminal-window {
            background: #0a0a0a; border: 1px solid #222; border-radius: 8px;
            overflow: hidden; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.8);
        }
        .terminal-header { background: #111; padding: 8px 12px; display: flex; gap: 6px; }
        .terminal-dot { width: 10px; height: 10px; border-radius: 50%; }
        .terminal-body { padding: 20px; font-size: 0.9rem; }

        .os-tab {
            padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer;
            transition: all 0.2s; font-size: 0.875rem; font-weight: 500;
        }
